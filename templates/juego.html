<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Song Battle</title>
</head>

<body>

    <h1>🎵 Song Battle</h1>

    <p>Pregunta {{ numero_pregunta }} de {{ total_preguntas }}</p>

    <hr>

    <h2>🎧 Escucha el audio y adivina el género</h2>

    <audio controls>
        <source src="{{ url_for('static', filename='songs/' + cancion['archivo']) }}" type="audio/wav">
        Tu navegador no soporta audio.
    </audio>

    <br><br>

    <p>Selecciona tu respuesta:</p>

    <form method="POST" action="/responder/{{ codigo }}">

        {% for opcion in opciones %}

            <button type="submit" name="respuesta" value="{{ opcion }}">
                🎵 {{ opcion }}
            </button>

            <br><br>

        {% endfor %}

    </form>

</body>
</html>
