<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Song Battle</title>
</head>

<body>

    <h1>🎵 Song Battle</h1>

    <p>Pregunta {{ numero_pregunta }} de {{ total_preguntas }}</p>

    <hr>

    <h2>🎧 {{ pregunta.pregunta }}</h2>

    <p>Selecciona tu respuesta:</p>

    <form method="POST" action="/responder/{{ codigo }}">

        {% for opcion in pregunta.opciones %}

            <button type="submit" name="respuesta" value="{{ loop.index0 }}">
                {{ opcion }}
            </button>

            <br><br>

        {% endfor %}

    </form>

</body>
</html>
