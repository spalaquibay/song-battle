<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear partida - Song Battle</title>
</head>

<body>

    <h1>🎵 Crear partida</h1>

    <p>Configura tu partida de Song Battle</p>

    <form method="POST">

        <label for="nickname">Tu nickname:</label>
        <br>

        <input
            type="text"
            id="nickname"
            name="nickname"
            placeholder="Escribe tu nombre"
            required
            maxlength="20"
        >

        <br><br>

        <label for="categoria">Categoría de canciones:</label>
        <br>

        <select id="categoria" name="categoria">
            <option value="todas">Todas</option>
            <option value="pop">Pop</option>
            <option value="rock">Rock</option>
            <option value="reggaeton">Reggaetón</option>
            <option value="latina">Música latina</option>
        </select>

        <br><br>

        <label for="preguntas">Número de preguntas:</label>
        <br>

        <select name="preguntas">
            <option value="5">5 preguntas</option>
        </select>

        <br><br>

        <button type="submit">🎮 Crear partida</button>

    </form>

    <br>

    <a href="/">← Volver al inicio</a>

</body>
</html>
