<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear partida - Song Battle</title>
</head>

<body>

    <h1>🎵 Crear partida</h1>

    <p>Configura tu partida de Song Battle</p>

    <form method="POST">

        <label for="nickname">Tu nickname:</label>
        <br>

        <input
            type="text"
            id="nickname"
            name="nickname"
            placeholder="Escribe tu nombre"
            required
            maxlength="20"
        >

        <br><br>

        <label for="total_preguntas">Cantidad de preguntas:</label>

        <select id="total_preguntas" name="total_preguntas">
            <option value="3">3 preguntas</option>
            <option value="5">5 preguntas</option>
        </select>

        <br><br>

        <button type="submit">🎮 Crear partida</button>

    </form>

    <br>

    <a href="/">← Volver al inicio</a>

</body>
</html>
