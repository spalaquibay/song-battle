<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugador - Song Battle</title>

    <script>
        function comprobarPartida() {

            fetch("/estado/{{ codigo }}")
                .then(response => response.json())
                .then(data => {

                    if (data.estado === "jugando") {
                        window.location.href = "/juego/{{ codigo }}";
                    }

                });
        }

        setInterval(comprobarPartida, 2000);
    </script>

</head>

<body>

    <h1>🎵 Song Battle</h1>

    <h2>¡Hola, {{ nickname }}! 👋</h2>

    <p>Te has unido a la partida:</p>

    <h1>{{ codigo }}</h1>

    <hr>

    <h2>⏳ Esperando al anfitrión...</h2>

    <p>El juego comenzará cuando el anfitrión inicie la partida.</p>

    <br>

    <a href="/unirse">← Salir</a>

</body>
</html>
