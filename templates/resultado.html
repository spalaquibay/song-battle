<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - Song Battle</title>
</head>

<body>

    <h1>🎵 Song Battle</h1>

    <h2>{{ resultado }}</h2>

    <p>⭐ Puntos de esta pregunta:</p>

    <h2>+{{ puntos_ganados }} punto(s)</h2>

    <p>🏆 Puntuación acumulada:</p>

    <h2>{{ puntos }} punto(s)</h2>

    <hr>

    {% if siguiente %}

        <form method="GET" action="/juego/{{ codigo }}">
            <button type="submit">➡️ Siguiente pregunta</button>
        </form>

    {% else %}

        <h2>🎉 ¡Partida terminada!</h2>
        <a href="/">Volver al inicio</a>

    {% endif %}

</body>
</html>
